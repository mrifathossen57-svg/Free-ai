{% extends "base.html" %}
{% block title %}Get Number{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-1">Get Number</h1>
<p class="text-sm text-gray-400 mb-6">Paste range (e.g. 22501XXX) to allocate a number. Numbers auto-expire after 15 minutes.</p>

<div class="card rounded-2xl p-5 mb-6">
  <label class="block text-xs text-emerald-400 uppercase font-semibold mb-2">Enter Number Range</label>
  <div class="flex flex-col sm:flex-row gap-3">
    <input id="range-input" type="text" placeholder="# 22501XXX or 26134"
           class="flex-1 px-4 py-3 rounded-xl bg-[#0b0e0c] border border-[#242d28] text-white font-mono text-sm focus:outline-none focus:border-emerald-500" />
    <button id="get-num-btn" onclick="allocateNumber()"
            class="px-6 py-3 rounded-xl accent-btn text-white font-semibold text-sm shrink-0">
      Get Number
    </button>
  </div>
  <div id="status-msg" class="text-xs mt-3 text-amber-300 hidden"></div>
</div>

<h2 class="text-sm font-semibold text-gray-400 uppercase mb-3">Allocated Numbers & Live OTP</h2>
<div id="numbers-list" class="space-y-3"></div>

<script>
const params = new URLSearchParams(window.location.search);
if (params.get('range')) {
  document.getElementById('range-input').value = params.get('range');
}

function formatTimer(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  return `${m}:${s}`;
}

function escapeAttr(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function extractOtpValue(msg) {
  const text = String(msg ?? '').trim();
  const match = text.match(/\b(\d{4,8})\b/);
  return match ? match[1] : text;
}

function copyText(txt, btn) {
  const val = String(txt ?? '');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(val).catch(() => {});
  } else {
    const ta = document.createElement('textarea');
    ta.value = val;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  const old = btn.innerText;
  btn.innerText = 'Copied';
  setTimeout(() => btn.innerText = old, 1200);
}

async function allocateNumber() {
  const input = document.getElementById('range-input');
  const msg = document.getElementById('status-msg');
  const btn = document.getElementById('get-num-btn');
  const rangeVal = input.value.trim();

  if (!rangeVal) return;
  btn.disabled = true;
  btn.innerText = 'Allocating...';
  msg.classList.add('hidden');

  try {
    const res = await fetch('/api/bridge/getnum', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ range: rangeVal })
    });
    const data = await res.json();
    if (!data.ok) {
      msg.innerText = data.message || 'Failed to get number.';
      msg.classList.remove('hidden');
    } else {
      await refreshNumbers();
    }
  } catch (e) {
    msg.innerText = 'Network error while requesting number.';
    msg.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.innerText = 'Get Number';
  }
}

let cachedNumbers = [];

async function refreshNumbers() {
  try {
    const res = await fetch('/api/bridge/my-numbers');
    const data = await res.json();
    if (data.ok) {
      cachedNumbers = data.numbers || [];
      renderNumbers();
    }
  } catch (e) {}
}

function renderNumbers() {
  const box = document.getElementById('numbers-list');
  if (!cachedNumbers.length) {
    box.innerHTML = '<div class="card rounded-2xl p-5 text-sm text-gray-400">No numbers generated yet.</div>';
    return;
  }

  box.innerHTML = cachedNumbers.map(n => {
    const timerBadge = n.expired
      ? `<span class="px-2.5 py-1 rounded-lg bg-rose-950 text-rose-400 text-xs font-semibold">EXPIRED (15m)</span>`
      : `<span class="px-2.5 py-1 rounded-lg bg-amber-950/70 text-amber-300 font-mono text-xs font-semibold">⏳ ${formatTimer(n.remaining_seconds)}</span>`;

    const otpToCopy = extractOtpValue(n.otp_message);
    const otpArea = n.otp_message
      ? `<div class="p-3 rounded-xl bg-emerald-950/50 border border-emerald-600/40 text-emerald-200 text-sm font-medium flex items-center justify-between gap-3">
           <span class="break-all">✅ OTP: ${escapeHtml(n.otp_message)}</span>
           <button type="button" onclick="copyText('${escapeAttr(otpToCopy)}', this)"
                   class="px-3 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold shrink-0">
             Copy OTP
           </button>
         </div>`
      : (n.expired
          ? `<div class="text-xs text-rose-400">No OTP received within 15 minutes.</div>`
          : `<div class="text-xs text-gray-400 animate-pulse">Waiting for incoming OTP...</div>`);

    return `
      <div class="card rounded-2xl p-4 grid grid-cols-1 md:grid-cols-2 gap-4 items-center ${n.expired ? 'opacity-60' : ''}">
        <div class="space-y-1.5">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="font-mono text-lg font-bold text-white">${escapeHtml(n.full_number)}</span>
            <button type="button" onclick="copyText('${escapeAttr(n.no_plus_number)}', this)"
                    class="px-2.5 py-1 rounded-lg bg-[#1a221e] text-xs text-emerald-300 hover:bg-[#232e28]">
              Copy
            </button>
            ${timerBadge}
          </div>
          <div class="text-xs text-gray-400">
            Country: <span class="text-gray-200">${escapeHtml(n.country)}</span> • Operator: <span class="text-gray-200">${escapeHtml(n.operator)}</span> • Range: <span class="font-mono">${escapeHtml(n.range)}</span>
          </div>
        </div>

        <div>
          ${otpArea}
        </div>
      </div>
    `;
  }).join('');
}

setInterval(() => {
  cachedNumbers.forEach(n => {
    if (n.remaining_seconds > 0) {
      n.remaining_seconds -= 1;
      if (n.remaining_seconds === 0) n.expired = true;
    }
  });
  renderNumbers();
}, 1000);

refreshNumbers();
setInterval(refreshNumbers, 5000);
</script>
{% endblock %}
