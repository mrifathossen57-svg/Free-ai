{% extends "base.html" %}
{% block title %}{{ section.label }}{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-1">{{ section.label }}</h1>
<p class="text-sm text-gray-400 mb-6">Recently active services and hitting ranges from connected panel.</p>

<div id="access-box" class="space-y-3">
  <div class="card rounded-2xl p-5 text-sm text-gray-400">Loading active services & ranges...</div>
</div>

<script>
async function loadAccess() {
  const res = await fetch('/api/bridge/liveaccess');
  const json = await res.json();
  const services = (json.data && json.data.services) || [];
  const box = document.getElementById('access-box');

  if (!services.length) {
    box.innerHTML = '<div class="card rounded-2xl p-5 text-sm text-gray-400">No active services right now.</div>';
    return;
  }

  box.innerHTML = services.map(s => `
    <div class="card rounded-2xl p-4">
      <div class="flex items-center justify-between mb-2">
        <span class="font-bold text-emerald-400">${s.sid}</span>
        <span class="text-xs text-gray-500">${s.last_at ? new Date(s.last_at).toLocaleTimeString() : ''}</span>
      </div>
      <div class="flex flex-wrap gap-2">
        ${(s.ranges || []).map(r => `
          <a href="/page/get-number?range=${encodeURIComponent(r)}"
             class="px-3 py-1 rounded-lg bg-[#18201c] hover:bg-emerald-700 hover:text-white font-mono text-xs text-amber-300 border border-[#26322c]">
            ${r} →
          </a>
        `).join('')}
      </div>
    </div>
  `).join('');
}
loadAccess();
</script>
{% endblock %}
