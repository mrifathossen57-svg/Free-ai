<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SR FREE AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #1e293b;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    header h1 {
      font-size: 1.2rem;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }
    header button {
      background: #334155;
      color: #e2e8f0;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }
    .msg {
      max-width: 82%;
      padding: 12px 15px;
      border-radius: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 0.96rem;
    }
    .user {
      align-self: flex-end;
      background: #0284c7;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .bot {
      align-self: flex-start;
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      border-bottom-left-radius: 4px;
    }
    .input-area {
      background: #1e293b;
      padding: 12px;
      border-top: 1px solid #334155;
    }
    .input-wrap {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }
    textarea {
      flex: 1;
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 1rem;
      resize: none;
      height: 46px;
      outline: none;
    }
    textarea:focus { border-color: #38bdf8; }
    #send-btn {
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      padding: 0 20px;
      cursor: pointer;
    }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <h1>✨ SR FREE AI</h1>
    <button onclick="clearChat()">নতুন চ্যাট</button>
  </header>

  <div id="chat-box">
    <div class="msg bot">হ্যালো! আমি <b>SR FREE AI</b>। তোমার কী প্রশ্ন বা কাজ আছে বলো, আমি সাহায্য করছি!</div>
  </div>

  <div class="input-area">
    <div class="input-wrap">
      <textarea id="user-input" placeholder="এখানে তোমার মেসেজ লেখো..."></textarea>
      <button id="send-btn" onclick="sendMessage()">পাঠাও</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById("chat-box");
    const input = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    let chatHistory = [];

    function appendMessage(text, sender) {
      const div = document.createElement("div");
      div.className = `msg ${sender}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    function clearChat() {
      chatHistory = [];
      chatBox.innerHTML = '<div class="msg bot">নতুন চ্যাট শুরু হয়েছে! কী জানতে চাও বলো?</div>';
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      sendBtn.disabled = true;
      appendMessage(text, "user");
      chatHistory.push({ role: "user", text });

      const loadingDiv = appendMessage("ভাবছি...", "bot");

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ history: chatHistory })
        });
        const data = await res.json();

        if (data.reply) {
          loadingDiv.textContent = data.reply;
          chatHistory.push({ role: "model", text: data.reply });
        } else {
          loadingDiv.textContent = data.error || "কিছু একটা সমস্যা হয়েছে।";
        }
      } catch (err) {
        loadingDiv.textContent = "সার্ভারের সাথে সংযোগ পাওয়া যাচ্ছে না।";
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
  </html>
