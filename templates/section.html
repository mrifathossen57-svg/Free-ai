{% extends "base.html" %}
{% block title %}{{ section.label }}{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-1">{{ section.label }}</h1>
<p class="text-sm text-gray-400 mb-6">Manage {{ section.label }} settings and live records.</p>

<div class="card rounded-2xl p-6">
  <p class="text-sm text-gray-300">
    Section <span class="font-semibold text-emerald-400">{{ section.label }}</span> is active for <span class="text-white">{{ user.email }}</span>.
  </p>
</div>
{% endblock %}
