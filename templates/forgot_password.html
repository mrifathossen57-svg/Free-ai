<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .box { background: #1e293b; padding: 24px; border-radius: 10px; width: 100%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,.35); }
    h2 { margin-top: 0; font-size: 20px; }
    label { display: block; margin-top: 12px; font-size: 13px; color: #cbd5e1; }
    input { width: 100%; padding: 10px; margin-top: 6px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
    button { width: 100%; padding: 10px; margin-top: 14px; border: none; border-radius: 6px; background: #2563eb; color: #fff; font-weight: bold; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .flash { padding: 10px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; background: #334155; }
    .back { display: block; text-align: center; margin-top: 14px; color: #93c5fd; text-decoration: none; font-size: 13px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Forgot Password</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}
          <div class="flash">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% if step == "request_code" %}
      <form method="POST" action="{{ url_for('forgot_password') }}">
        <input type="hidden" name="action" value="send_code" />
        <label>Account Email</label>
        <input type="email" name="email" value="{{ email }}" placeholder="Enter your registered email" required />
        <button type="submit">Send Code</button>
      </form>
    {% else %}
      <form method="POST" action="{{ url_for('forgot_password') }}">
        <input type="hidden" name="action" value="reset_password" />
        <label>Account Email</label>
        <input type="email" name="email" value="{{ email }}" required />

        <label>Verification Code (6-digit)</label>
        <input type="text" name="code" placeholder="Enter code from email" required />

        <label>New Password</label>
        <input type="password" name="new_password" placeholder="Enter new password" required />

        <label>Confirm New Password</label>
        <input type="password" name="confirm_password" placeholder="Confirm new password" required />

        <button type="submit">Set New Password</button>
      </form>
    {% endif %}

    <a class="back" href="{{ url_for('login') }}">Back to Login</a>
  </div>
</body>
</html>
