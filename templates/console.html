{% extends "base.html" %}
{% block title %}Live Console{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-6">
  <div>
    <h1 class="text-2xl font-bold">Live Console</h1>
    <p class="text-xs text-gray-400">Global live feed of recent hits (Auto-refresh every 5s)</p>
  </div>
  <span class="px-3 py-1 rounded-full bg-emerald-950 border border-emerald-700/50 text-emerald-400 text-xs font-semibold">● LIVE</span>
</div>

<div id="console-feed" class="space-y-3">
  <div class="card rounded-2xl p-5 text-sm text-gray-400">Loading live console feed...</div>
</div>

<script>
function copyRange(rangeText, btn) {
  navigator.clipboard.writeText(rangeText);
  const old = btn.innerText;
  btn.innerText = 'Copied!';
  setTimeout(() => btn.innerText = old, 1200);
}

async function loadConsole() {
  try {
    const res = await fetch('/api/bridge/console');
    const json = await res.json();
    const hits = (json.data && json.data.hits) || [];
    const box = document.getElementById('console-feed');

    if (!hits.length) {
      box.innerHTML = '<div class="card rounded-2xl p-5 text-sm text-gray-400">No recent hits found.</div>';
      return;
    }

    box.innerHTML = hits.map(h => {
      const t = h.time ? new Date(h.time).toLocaleTimeString() : '';
      return `
        <div class="card rounded-2xl p-4 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
          <div class="space-y-1">
            <div class="flex items-center gap-2 text-xs">
              <span class="px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 font-bold">${h.sid || 'SERVICE'}</span>
              <span class="font-mono text-amber-300 font-semibold">${h.range || ''}</span>
              <span class="text-gray-500">${t}</span>
            </div>
            <div class="text-sm text-gray-200 break-all">→ ${h.message || ''}</div>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <button onclick="copyRange('${h.range}', this)"
                    class="px-3 py-1.5 rounded-xl bg-[#1a221e] hover:bg-[#24302a] text-xs text-emerald-300 border border-emerald-800/40">
              Copy Range
            </button>
            <a href="/page/get-number?range=${encodeURIComponent(h.range || '')}"
               class="px-3 py-1.5 rounded-xl accent-btn text-xs text-white font-semibold">
              Use Range →
            </a>
          </div>
        </div>
      `;
    }).join('');
  } catch (e) {
    console.error(e);
  }
}

loadConsole();
setInterval(loadConsole, 5000);
</script>
{% endblock %}
